<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2e7d32">
<title>Basketry · Family Groceries</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg: #f4f6f1; --fg: #1b1f19; --muted: #5d655a; --card: #fff; --accent: #2e7d32; --accent-ink: #fff; --accent-soft: #e4efe2; --line: #e0e4db; --radius: 14px; --shadow: 0 1px 2px rgba(20, 30, 18, .06), 0 6px 18px rgba(20, 30, 18, .06); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f120d; --fg: #eef2ea; --muted: #a2ab9d; --card: #171c14; --accent: #86d887; --accent-ink: #0f120d; --accent-soft: #223020; --line: #2a3425; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 20px rgba(0, 0, 0, .35); }
  }
  :root[data-theme="light"] { --bg: #f4f6f1; --fg: #1b1f19; --muted: #5d655a; --card: #fff; --accent: #2e7d32; --accent-ink: #fff; --accent-soft: #e4efe2; --line: #e0e4db; --shadow: 0 1px 2px rgba(20, 30, 18, .06), 0 6px 18px rgba(20, 30, 18, .06); }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 24px; }
  h1 { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; margin: 6px 0 16px; }
  form { display: flex; gap: 8px; margin-bottom: 12px; }
  input, select, button { font: inherit; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); padding: 0 12px; background: var(--card); color: var(--fg); }
  input[name="name"] { flex: 1; min-width: 0; }
  input[name="qty"] { width: 64px; }
  input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; padding: 0; margin: 0; flex: none; accent-color: var(--accent); }
  select, #order-search { flex: 1; min-width: 0; }
  button { cursor: pointer; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; padding: 0 18px; transition: transform .08s; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; color: var(--muted); border-color: transparent; font-weight: 500; padding: 0 10px; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .bar { display: flex; gap: 8px; margin-bottom: 10px; }
  #save-order { background: var(--accent-soft); color: var(--accent); border-color: transparent; white-space: nowrap; }
  .add-row { display: grid; grid-template-columns: auto minmax(0, 1fr) 40px auto; gap: 8px; }
  .add-row select { flex: none; width: auto; max-width: 140px; }
  .add-row input[name="name"] { flex: none; width: 100%; font-weight: 600; }
  .add-row input[name="name"]::placeholder { font-weight: 700; color: var(--accent); opacity: 1; }
  .add-row input[name="qty"] { width: 40px; padding: 0 4px; text-align: center; }
  .add-row button { padding: 0 16px; }
  .add-wrap { position: relative; margin-bottom: 14px; }
  @media (max-width: 480px) {
    .bar { flex-wrap: wrap; }
    .bar #view { flex: 1 1 100%; }
    .add-row { grid-template-columns: minmax(0, 1fr) 40px auto; }
    .add-row select { grid-column: 1 / -1; max-width: none; width: 100%; }
  }
  aside.side { display: none; }
  @media (min-width: 900px) {
    main { max-width: 1100px; display: grid; grid-template-columns: 260px minmax(0, 1fr); column-gap: 32px; align-items: start; }
    main > aside.side { display: flex; flex-direction: column; gap: 20px; grid-row: 1 / span 30; position: sticky; top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 16px; box-shadow: var(--shadow); }
    main > :not(aside.side) { grid-column: 2; min-width: 0; }
    main > h1 { margin-top: 0; }
  }
  .side-brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
  .side-label { font-size: 12px; font-weight: 600; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
  .side-item { display: block; width: 100%; text-align: left; background: transparent; color: var(--fg); border: 0; border-radius: 10px; padding: 10px 12px; font-size: 15px; font-weight: 500; }
  .side-item:hover { background: var(--bg); }
  .side-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .side-foot { margin-top: auto; font-size: 13px; color: var(--muted); }
  .add-wrap form { margin-bottom: 0; }
  .suggest { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 10; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 12px 32px rgba(0, 0, 0, .16); padding: 14px; max-height: 60vh; overflow-y: auto; }
  .suggest h3 { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
  .tiles { display: flex; gap: 8px; margin-bottom: 8px; }
  .tile { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; color: var(--fg); padding: 8px 4px; font-size: .85rem; font-weight: 500; overflow: hidden; }
  .tile:hover { background: var(--bg); }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 6px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 10px; }
  .row:hover { background: var(--bg); }
  .avatar { width: 84px; height: 84px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; flex: none; }
  .row .avatar { width: 56px; height: 56px; font-size: .9rem; background: var(--accent-soft); color: var(--accent); }
  .avatar.pic { background: none; object-fit: cover; }
  .list-pic { width: 56px; height: 56px; flex: none; border-radius: 50%; object-fit: cover; cursor: zoom-in; }
  dialog.zoom { border: 0; padding: 0; background: transparent; max-width: 92vw; max-height: 92vh; }
  dialog.zoom::backdrop { background: rgba(0, 0, 0, .75); }
  dialog.zoom img { display: block; max-width: 92vw; max-height: 85vh; border-radius: var(--radius); }
  .row .arrow { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 1.1rem; padding: 4px 8px; }
  h2 { display: flex; align-items: center; gap: 8px; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 4px 8px; }
  ul { list-style: none; padding: 0; margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  li { display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px; min-height: 68px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  li label { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: center; cursor: pointer; min-height: 44px; }
  li label span { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
  li.done span { text-decoration: line-through; color: var(--muted); }
  li.done .list-pic { opacity: .45; }
  .qty { color: var(--accent); background: var(--accent-soft); font-weight: 600; font-size: .85rem; border-radius: 999px; padding: 3px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .by { color: var(--muted); font-size: .8rem; white-space: nowrap; }
  .empty { color: var(--fg); text-align: center; padding: 44px 16px; line-height: 1.5; }
  .empty small { display: block; margin-top: 6px; font-size: .9rem; color: var(--muted); }
  footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }
  #count { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <aside class="side" aria-label="Lists and orders">
    <div class="side-brand"><img src="icon.svg" alt="" width="32" height="32">Basketry</div>
    <div>
      <div class="side-label">LISTS</div>
      <button class="side-item" id="side-current" type="button">Current list</button>
    </div>
    <div>
      <div class="side-label">SAVED ORDERS</div>
      <div id="side-orders"></div>
    </div>
    <div class="side-foot">Family code: <span id="side-family"></span></div>
  </aside>
  <h1><img src="icon.svg" alt="" width="36" height="36" style="vertical-align: middle; margin-right: 8px;">Basketry <small style="font-weight: normal; color: var(--muted); font-size: .8rem;">· Family Groceries · רשימת קניות</small></h1>
  <div class="bar">
    <select id="view" aria-label="Show list or order"></select>
    <input type="search" id="order-search" placeholder="Search orders by item" aria-label="Search orders by item (English or Hebrew)" dir="auto">
    <button class="ghost" id="save-order" type="button">Save as order</button>
  </div>
  <div class="bar" id="orders-bar" hidden>
    <button class="ghost" id="more-orders" type="button"></button>
  </div>
  <form id="join" hidden>
    <input name="code" placeholder="Family code (same on every phone)" autocomplete="off" required>
    <input name="who" placeholder="Your name" autocomplete="name" required>
    <button type="submit">Join</button>
  </form>
  <div class="add-wrap">
  <form id="add" class="add-row">
    <select id="group" aria-label="Choose a group"></select>
    <input name="name" dir="auto" placeholder="Add an item (Hebrew or English)" autocomplete="off" required>
    <input name="qty" type="number" min="1" value="1" aria-label="Quantity">
    <button type="submit">Add</button>
  </form>
    <div id="suggest" class="suggest" hidden></div>
  </div>
  <div id="list"></div>
  <footer>
    <button class="ghost" id="clear" type="button">Clear checked</button>
    <span class="qty" id="count"></span>
  </footer>
</main>
<dialog class="zoom" id="zoom"><img id="zoom-img" alt=""></dialog>
<script type="module">
  import { addItem, toggleItem, removeItem, clearDone, groupByCategory, suggestNames, suggestMatches, displayName, CATEGORIES } from './list.js';
  import { bilingual, HE_TO_EN, groupOf, GROUP_FOR, hebrewOf } from './translate.js';
  import { ICON_FOR } from './icons.js';
  import { saveOrder, findOrder, copyOrderToList, deleteOrder, searchOrders, recentOrders, ordersByMonth, notBoughtCount } from './orders.js';
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
  import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
  import { initializeFirestore, persistentLocalCache, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';

  // Public project identifiers, not secrets. Access is controlled by the Firestore security rules.
  const firebaseConfig = {
    apiKey: "AIzaSyDGthIpo2j1zZbCXSJnz3ofijJw2pPfShg",
    authDomain: "basketry-28d9d.firebaseapp.com",
    projectId: "basketry-28d9d",
    storageBucket: "basketry-28d9d.firebasestorage.app",
    messagingSenderId: "730917129251",
    appId: "1:730917129251:web:6232da4a62a71276643596",
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  // Offline edits are kept on the phone and sent when the connection returns.
  const db = initializeFirestore(app, { localCache: persistentLocalCache() });

  // Everyone who types the same family code shares one list. The code is remembered per device.
  const joinForm = document.getElementById('join');
  let family = '';
  let me = '';
  try { family = localStorage.getItem('basketry.family') ?? ''; me = localStorage.getItem('basketry.name') ?? ''; } catch { /* storage blocked */ }
  if (!family || !me) {
    joinForm.hidden = false;
    joinForm.elements.code.value = family;
    const got = await new Promise(resolve => joinForm.addEventListener('submit', e => {
      e.preventDefault();
      resolve({ code: e.currentTarget.elements.code.value.trim().toLowerCase().replace(/\//g, '-'), who: e.currentTarget.elements.who.value.trim() });
    }, { once: true }));
    family = got.code;
    me = got.who;
    joinForm.hidden = true;
    try { localStorage.setItem('basketry.family', family); localStorage.setItem('basketry.name', me); } catch { /* asked again next visit */ }
  }
  const ref = doc(db, 'families', family);
  const who = me;

  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  const viewEl = document.getElementById('view');
  const saveBtn = document.getElementById('save-order');
  const addForm = document.getElementById('add');
  const clearBtn = document.getElementById('clear');

  // The whole family state (list and orders) lives in one Firestore document.
  function persist() {
    setDoc(ref, { items, orders }).catch(err => console.error('Save failed', err));
  }

  let items = [];
  let orders = [];
  let view = ''; // '' = current list, otherwise an order id
  let pendingDelete = ''; // order id waiting for a second tap to delete
  let orderQuery = ''; // item name typed in the order search
  let showAllOrders = false; // false = newest 12 orders only
  const ordersBar = document.getElementById('orders-bar');
  const orderSearch = document.getElementById('order-search');
  const moreBtn = document.getElementById('more-orders');
  let group = ''; // '' = all groups, otherwise a group name
  const groupEl = document.getElementById('group');
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  // With a group chosen, the search box looks only at that group's products (English and Hebrew).
  function groupCandidates() {
    return (GROUP_FOR[group] ?? []).flatMap(en => [cap(en), hebrewOf(en)].filter(Boolean));
  }
  groupEl.addEventListener('change', () => {
    group = groupEl.value;
    nameInput.value = ''; // the name typed for the old group does not carry over
    render();
    showSuggestions();
  });
  groupEl.replaceChildren(new Option('All groups', ''), ...CATEGORIES.map(c => new Option(c, c)));

  // Suggestions: grocery words plus anything already used in a list or order.
  let knownNames = [];
  function renderSuggestions() {
    knownNames = suggestNames([
      ...Object.keys(HE_TO_EN),
      ...Object.values(HE_TO_EN),
      ...items.map(englishName),
      ...orders.flatMap(o => o.items.map(englishName)),
    ]);
  }

  const nameInput = addForm.elements.name;
  const suggestEl = document.getElementById('suggest');
  nameInput.addEventListener('focus', showSuggestions);
  // Puts the picked name in the box; the item is added only when the form is submitted.
  function pickSuggestion(n) {
    nameInput.value = n;
    suggestEl.hidden = true;
    nameInput.focus();
  }

  // Bold the part of the name that matches what was typed.
  function highlight(name, query) {
    const frag = document.createDocumentFragment();
    const i = name.toLowerCase().indexOf(query.toLowerCase());
    if (!query || i < 0) { frag.append(name); return frag; }
    const bold = document.createElement('strong');
    bold.textContent = name.slice(i, i + query.length);
    frag.append(name.slice(0, i), bold, name.slice(i + query.length));
    return frag;
  }

  function suggestionEl(n, query, tile) {
    const el = document.createElement(tile ? 'button' : 'div');
    el.className = tile ? 'tile' : 'row';
    if (tile) el.type = 'button';
    const icon = ICON_FOR[bilingual(n).name.toLowerCase()];
    const avatar = document.createElement(icon ? 'img' : 'span');
    avatar.className = icon ? 'avatar pic' : 'avatar';
    if (icon) { avatar.src = icon; avatar.alt = ''; } else { avatar.textContent = n[0].toUpperCase(); }
    const label = document.createElement('span');
    label.append(highlight(n, nameInput.value.trim()));
    el.append(avatar, label);
    if (!tile) {
      const arrow = document.createElement('button');
      arrow.type = 'button';
      arrow.className = 'arrow';
      arrow.textContent = '↖';
      arrow.setAttribute('aria-label', `Use ${n}`);
      el.append(arrow);
    }
    // mousedown, not click, so the pick lands before the input loses focus
    el.addEventListener('mousedown', e => { e.preventDefault(); pickSuggestion(n); });
    return el;
  }

  function showSuggestions() {
    const query = nameInput.value.trim();
    const pool = group ? groupCandidates() : knownNames;
    const matches = query ? suggestMatches(pool, query, Infinity) : (group ? (GROUP_FOR[group] ?? []).map(cap) : []);
    suggestEl.hidden = matches.length === 0;
    if (matches.length === 0) return;
    const heading = document.createElement('h3');
    heading.textContent = 'Suggestions';
    const tiles = document.createElement('div');
    tiles.className = 'tiles';
    tiles.append(...matches.slice(0, 3).map(n => suggestionEl(n, query, true)));
    suggestEl.replaceChildren(heading, tiles, ...matches.slice(3).map(n => suggestionEl(n, query, false)));
  }
  nameInput.addEventListener('input', showSuggestions);
  // Select the default "1" on focus so typing a number replaces it instead of appending.
  addForm.elements.qty.addEventListener('focus', e => e.target.select());
  nameInput.addEventListener('blur', () => { suggestEl.hidden = true; });

  // The English name comes from the Hebrew label when it is known, so items saved earlier
  // (for example "Yellow onion [בצל יבש]") show the current English name.
  function englishName(item) {
    const known = item.he ? bilingual(item.he) : null;
    const name = known?.he ? known.name : item.name;
    return name.charAt(0).toUpperCase() + name.slice(1);
  }

  // Orders to list: the search results, or the newest 12 unless "show all" is on.
  function visibleOrders() {
    if (orderQuery) return searchOrders(orders, orderQuery);
    return showAllOrders ? orders : recentOrders(orders).recent;
  }

  // Newest first; an open order stays listed even when a search hides it.
  function listedOrders() {
    const shown = new Set(visibleOrders());
    return orders.filter(o => shown.has(o) || o.id === view);
  }

  // "2026-10-08 · 12 items · 5 not bought"
  function orderLabel(o) {
    return `${o.date} · ${o.items.length} items · ${notBoughtCount(o)} not bought`;
  }

  function monthLabel(month) {
    return new Date(`${month}-01T00:00:00`).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  }

  function renderViewOptions() {
    viewEl.replaceChildren(new Option(`Current list (${items.length})`, ''));
    for (const { month, orders: list } of ordersByMonth(listedOrders())) {
      const optgroup = document.createElement('optgroup');
      optgroup.label = monthLabel(month);
      for (const o of list) optgroup.append(new Option(orderLabel(o), o.id));
      viewEl.append(optgroup);
    }
    viewEl.value = findOrder(orders, view) ? view : '';
    view = viewEl.value;
    ordersBar.hidden = orders.length === 0;
    moreBtn.hidden = orderQuery !== '' || orders.length <= 12;
    moreBtn.textContent = showAllOrders ? 'Show fewer orders' : `Show ${recentOrders(orders).older.length} older orders`;
  }

  // Desktop sidebar: the current list, the saved orders by month (click to open one), and the family code.
  function renderSidebar() {
    const current = document.getElementById('side-current');
    current.classList.toggle('active', view === '');
    current.textContent = `Current list (${items.length})`;
    current.onclick = () => { view = ''; render(); };
    const ordersEl = document.getElementById('side-orders');
    ordersEl.replaceChildren(...ordersByMonth(listedOrders()).flatMap(({ month, orders: list }) => [
      Object.assign(document.createElement('div'), { className: 'side-label', textContent: monthLabel(month) }),
      ...list.map(o => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'side-item' + (view === o.id ? ' active' : '');
        b.textContent = orderLabel(o);
        b.addEventListener('click', () => { view = o.id; render(); });
        return b;
      }),
    ]));
    document.getElementById('side-family').textContent = family;
  }

  function render() {
    renderSidebar();
    renderViewOptions();
    renderSuggestions();
    const order = findOrder(orders, view);
    const readOnly = Boolean(order);
    const shown = order ? order.items : items;

    addForm.hidden = readOnly;
    clearBtn.hidden = readOnly;
    saveBtn.disabled = items.length === 0;

    listEl.replaceChildren();
    if (shown.length === 0) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = readOnly ? 'This order is empty.' : 'Nothing on the list yet.';
      if (!readOnly) p.append(Object.assign(document.createElement('small'), { textContent: 'Type an item above, or tap a suggestion.' }));
      listEl.append(p);
    }
    for (const group of groupByCategory(shown)) {
      const h = document.createElement('h2');
      h.textContent = group.category;
      const ul = document.createElement('ul');
      for (const item of group.items) {
        const li = document.createElement('li');
        li.className = item.done ? 'done' : '';

        const label = document.createElement('label');
        const span = document.createElement('span');
        span.textContent = displayName({ ...item, name: englishName(item) });
        const icon = ICON_FOR[englishName(item).toLowerCase()];
        const pic = icon ? Object.assign(document.createElement('img'), { src: icon, alt: '', className: 'list-pic' }) : null;
        if (readOnly) {
          const box = document.createElement('input');
          box.type = 'checkbox';
          box.checked = Boolean(item.done);
          box.disabled = true;
          label.append(box, ...[pic, span].filter(Boolean));
        } else {
          const box = document.createElement('input');
          box.type = 'checkbox';
          box.checked = item.done;
          box.addEventListener('change', () => update(toggleItem(items, item.id)));
          label.append(box, ...[pic, span].filter(Boolean));
        }

        const qty = document.createElement('span');
        qty.className = 'qty';
        qty.textContent = `× ${item.qty}`;

        const extra = [];
        if (item.by) {
          const by = document.createElement('span');
          by.className = 'by';
          by.textContent = `by ${item.by}`;
          extra.push(by);
        }
        li.append(label, ...extra, qty);
        if (!readOnly) {
          const del = document.createElement('button');
          del.className = 'ghost';
          del.type = 'button';
          del.textContent = '✕';
          del.setAttribute('aria-label', `Remove ${item.name}`);
          del.addEventListener('click', () => update(removeItem(items, item.id)));
          li.append(del);
        }
        ul.append(li);
      }
      listEl.append(h, ul);
    }

    if (readOnly) {
      const copy = document.createElement('button');
      copy.type = 'button';
      copy.textContent = 'Copy this order to my list';
      copy.style.marginTop = '16px';
      copy.addEventListener('click', () => {
        items = copyOrderToList(items, order);
        persist();
        view = '';
        render();
      });
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'ghost';
      del.style.marginTop = '8px';
      del.textContent = pendingDelete === order.id ? 'Tap again to delete this order' : 'Delete this order';
      del.addEventListener('click', () => {
        if (pendingDelete !== order.id) { pendingDelete = order.id; render(); return; }
        orders = deleteOrder(orders, order.id);
        persist();
        pendingDelete = '';
        view = '';
        render();
      });
      listEl.append(copy, del);
      countEl.textContent = orderLabel(order);
    } else {
      const open = items.filter(i => !i.done).length;
      countEl.textContent = `${items.length} items · ${open} to buy`;
    }
  }

  function update(next) {
    items = next;
    persist();
    render();
  }

  viewEl.addEventListener('change', () => {
    view = viewEl.value;
    pendingDelete = '';
    render();
  });

  orderSearch.addEventListener('input', () => {
    orderQuery = orderSearch.value.trim();
    render();
  });

  moreBtn.addEventListener('click', () => {
    showAllOrders = !showAllOrders;
    render();
  });

  saveBtn.addEventListener('click', () => {
    orders = saveOrder(orders, items);
    items = [];
    persist();
    render();
  });

  addForm.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.currentTarget;
    const { name, he } = bilingual(f.elements.name.value);
    // shortcut: every new item lands in Other, no category picker, upgrade when the list gets long to sort by aisle
    update(addItem(items, name, groupOf(name), f.elements.qty.value, he, who));
    f.reset();
    suggestEl.hidden = true;
    nameInput.focus();
  });

  clearBtn.addEventListener('click', () => update(clearDone(items)));

  // Tap a list picture to see it large; the click must not toggle the item's checkbox.
  const zoom = document.getElementById('zoom');
  const zoomImg = document.getElementById('zoom-img');
  listEl.addEventListener('click', e => {
    if (!e.target.classList.contains('list-pic')) return;
    e.preventDefault();
    zoomImg.src = e.target.src;
    zoom.showModal();
  });
  zoom.addEventListener('click', () => zoom.close());

  render();

  // Sign in anonymously, then keep the page in step with the family document on every phone.
  signInAnonymously(auth)
    .then(() => onSnapshot(ref, snap => {
      const data = snap.data();
      if (data) { items = data.items ?? []; orders = data.orders ?? []; }
      render();
    }))
    .catch(err => {
      console.error('Connection failed', err);
      countEl.textContent = 'Could not connect to the family list';
    });

  // Offline support: cache the app shell.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
