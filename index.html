<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2e7d32">
<title>Family Groceries</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg: #f6f7f4; --fg: #1d1f1b; --muted: #6b7068; --card: #fff; --accent: #2e7d32; --line: #e2e5de; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15180f; --fg: #eef0ea; --muted: #9aa094; --card: #1e2218; --accent: #7fd17f; --line: #323826; }
  }
  :root[data-theme="light"] { --bg: #f6f7f4; --fg: #1d1f1b; --muted: #6b7068; --card: #fff; --accent: #2e7d32; --line: #e2e5de; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 12px; }
  form { display: flex; gap: 8px; margin-bottom: 12px; }
  input, select, button { font: inherit; border-radius: 8px; border: 1px solid var(--line); padding: 10px; background: var(--card); color: var(--fg); }
  input[name="name"] { flex: 1; min-width: 0; }
  input[name="qty"] { width: 64px; }
  button { cursor: pointer; background: var(--accent); color: #fff; border-color: var(--accent); }
  button.ghost { background: transparent; color: var(--muted); border-color: transparent; }
  h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 6px; }
  ul { list-style: none; padding: 0; margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  li label { flex: 1; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  li.done span { text-decoration: line-through; color: var(--muted); }
  .qty { color: var(--muted); font-size: .9rem; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>Family Groceries</h1>
  <form id="add">
    <input name="name" dir="auto" placeholder="Add an item (Hebrew or English)" autocomplete="off" required>
    <input name="qty" type="number" min="1" value="1" aria-label="Quantity">
    <button type="submit">Add</button>
  </form>
  <div id="list"></div>
  <footer>
    <button class="ghost" id="clear" type="button">Clear checked</button>
    <span class="qty" id="count"></span>
  </footer>
</main>
<script type="module">
  import { CATEGORIES, addItem, toggleItem, removeItem, clearDone, groupByCategory } from './list.js';
  import { translateItem } from './translate.js';

  const KEY = 'grocery.list.v1';
  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');

  // localStorage can be blocked (private mode, policies); the app still works in memory.
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) ?? []; } catch { return []; }
  }
  function save(items) {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch { /* not persisted */ }
  }

  let items = load();

  function render() {
    listEl.replaceChildren();
    if (items.length === 0) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'Nothing on the list yet.';
      listEl.append(p);
    }
    for (const group of groupByCategory(items)) {
      const h = document.createElement('h2');
      h.textContent = group.category;
      const ul = document.createElement('ul');
      for (const item of group.items) {
        const li = document.createElement('li');
        li.className = item.done ? 'done' : '';

        const label = document.createElement('label');
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = item.done;
        box.addEventListener('change', () => update(toggleItem(items, item.id)));
        const span = document.createElement('span');
        span.textContent = item.name;
        label.append(box, span);

        const qty = document.createElement('span');
        qty.className = 'qty';
        qty.textContent = item.qty > 1 ? `× ${item.qty}` : '';

        const del = document.createElement('button');
        del.className = 'ghost';
        del.type = 'button';
        del.textContent = '✕';
        del.setAttribute('aria-label', `Remove ${item.name}`);
        del.addEventListener('click', () => update(removeItem(items, item.id)));

        li.append(label, qty, del);
        ul.append(li);
      }
      listEl.append(h, ul);
    }
    const open = items.filter(i => !i.done).length;
    countEl.textContent = `${open} to buy`;
  }

  function update(next) {
    items = next;
    save(items);
    render();
  }

  document.getElementById('add').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.currentTarget;
    const name = translateItem(f.elements.name.value);
    // shortcut: every new item lands in Other, no category picker, upgrade when the list gets long to sort by aisle
    update(addItem(items, name, 'Other', f.elements.qty.value));
    f.reset();
    f.elements.name.focus();
  });

  document.getElementById('clear').addEventListener('click', () => update(clearDone(items)));

  render();

  // Offline support: cache the app shell.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
